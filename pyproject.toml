[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myresearchpy"
version = "0.1.0"
description = "A theoretical research software package built on FAIR and CURE principles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Your Name", email = "you@example.org" }]
keywords = [
  "research-software",
  "FAIR",
  "CURE",
  "reproducibility",
  "scientific-computing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
docs = [
  "sphinx>=7.2",
  "myst-parser>=2.0",
  "numpydoc>=1.6",
  "sphinx-copybutton>=0.5",
  "sphinx-book-theme>=1.1",
]

[project.urls]
Homepage = "https://github.com/your-org/myresearchpy"
Documentation = "https://your-org.github.io/myresearchpy/"
Repository = "https://github.com/your-org/myresearchpy"
"Bug Tracker" = "https://github.com/your-org/myresearchpy/issues"

[tool.hatch.version]
path = "src/myresearchpy/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/myresearchpy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "pixi.lock", "LICENSE", "README.md"]

# ---------------------------------------------------------------------------
# pixi: reproducible, fully declared environments
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
name = "myresearchpy"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
description = "Reproducible environments for myresearchpy."
authors = ["Your Name <you@example.org>"]

[tool.pixi.dependencies]
python = ">=3.10,<3.14"
numpy = ">=1.24"
scipy = ">=1.10"
sympy = ">=1.12"

# Per-interpreter constraints, selected with `pixi run -e <env>`. Each pins the
# exact minor version so that CI genuinely exercises every version it claims
# to, rather than always resolving to the newest one allowed above.
[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
myresearchpy = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=7.2"
myst-parser = ">=2.0"
numpydoc = ">=1.6"
sphinx-copybutton = ">=0.5"
sphinx-book-theme = ">=1.1"

[tool.pixi.feature.docs.pypi-dependencies]
myresearchpy = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pre-commit = ">=3.6"
ruff = ">=0.4"

[tool.pixi.feature.dev.pypi-dependencies]
myresearchpy = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["test", "docs", "dev"], solve-group = "default" }
test = { features = ["test"], solve-group = "test" }
docs = { features = ["docs"], solve-group = "docs" }
dev = { features = ["test", "docs", "dev"], solve-group = "default" }
py310 = { features = ["py310", "test"], solve-group = "py310" }
py311 = { features = ["py311", "test"], solve-group = "py311" }
py312 = { features = ["py312", "test"], solve-group = "py312" }
py313 = { features = ["py313", "test"], solve-group = "py313" }

[tool.pixi.tasks]
test = "pytest"
test-cov = "pytest --cov=myresearchpy --cov-report=term-missing --cov-report=xml"
lint = "ruff check src tests scripts"
format = "ruff format --check src tests scripts"
format-fix = "ruff format src tests scripts"
check-template = "python scripts/check_template.py --verbose"
docs = "sphinx-build -b html docs docs/_build/html"
docs-live = "sphinx-build -b html docs docs/_build/html"

[tool.pixi.activation.env]
# Ignore any user site-packages that could shadow the environment's Sphinx.
PYTHONNOUSERSITE = "1"

[tool.pixi.feature.docs.tasks]
docs-strict = "sphinx-build -b html -W --keep-going docs docs/_build/html"
docs-pdf = "sphinx-build -b latexpdf docs docs/_build/latexpdf"

[tool.pixi.feature.dev.tasks]
precommit-install = "pre-commit install"
precommit-run = "pre-commit run --all-files"

# ---------------------------------------------------------------------------
# tooling configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]
markers = ["slow: marks tests as slow"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Explicit src layout, so the package is always treated as first-party. Without
# this, ruff guesses the root and disagrees between versions about which
# imports are local.
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["myresearchpy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"docs/conf.py" = ["D"]

[tool.coverage.run]
source = ["myresearchpy"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
