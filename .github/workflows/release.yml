name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/myresearchpy

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          run-install: default

      - name: Verify the tag matches the package version
        run: |
          version=$(pixi run python -c \
            "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"',pathlib.Path('src/myresearchpy/__version__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match __version__ $version" >&2
            exit 1
          fi

      - name: Run tests
        run: pixi run test

      - name: Build distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
