name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: ["py312"]
        include:
          - os: ubuntu-latest
            env: "py310"
          - os: ubuntu-latest
            env: "py311"
          - os: ubuntu-latest
            env: "py313"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          # Each matrix entry installs its own environment, which pins the
          # exact Python minor version declared in pyproject.toml.
          run-install: ${{ matrix.env }}

      - name: Report interpreter version
        run: pixi run -e ${{ matrix.env }} python -VV

      - name: Run tests
        run: pixi run -e ${{ matrix.env }} test

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.env == 'py312'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
